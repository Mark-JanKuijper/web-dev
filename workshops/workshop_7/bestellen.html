<h2>Bestellen: Nike Air Max 90</h2>

<form class="formulier">
<div class="veld">
    <label for="voornaam">Voornaam</label>
    <input type="text" id="voornaam" name="voornaam" placeholder="sanne" required>
</div>

<div class="veld">
    <label for="achternaam">Achternaam</label>
    <input type="text" name="achternaam" id="achternaam" required>
</div>

<div class="veld">
    <label for="email">E-mailadres</label>
    <input type="email" name="email" id="email" required>
</div>

<div class="veld">
    <label for="aantal">aantal</label>
    <input type="number" name="aantal" id="aantal" min="1" max="10" value="1" required>
</div>

<div class="veld">
    <label for="maat">maat</label>
    <select name="maat" id="maat">
        <option value="40">40</option>
        <option value="41">41</option>
        <option value="42">42</option>
        <option value="43">43</option>
        <option value="44">44</option>
    </select>
</div>

<div class="veld vinkje">
    <input type="checkbox" id="voorwaarden" name="voorwaarden" required>
    <label for="voorwaarden">ik ga akkoord met de voorwaarden</label>
</div>
<input type="submit" value="Bestelling plaatsen" class="knop">
<div class="veld vinkje"></div>



</form>
    

  <!-- div zijn lege doosjes van informatie, ze worden zichtbaar als ze informatie krijgen -->
